name: Sanity Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      # Node 24: the export script and the test runner rely on native type
      # stripping, and `engines` in package.json says so.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Format, lint, typecheck, unit tests.
      - run: npm run check
      # The Worker + client bundle: catches breakage that typechecking misses.
      - run: npm run build
